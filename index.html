<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LEVEL HOSE</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEVEL HOSE">
<meta name="theme-color" content="#12161f">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c2230'/><text x='50' y='68' font-size='55' text-anchor='middle'>⚓️</text></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"LEVEL HOSE Calculator","short_name":"LEVEL HOSE","display":"standalone","background_color":"%2312161f","theme_color":"%2312161f","start_url":"."}'>

<style>
  :root {
    --bg: #12161f; --card: #1c2230; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #eab308; --port: #ef4444;
    --stbd: #22c55e; --border: #2e3748;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: env(safe-area-inset-top, 16px) 16px 24px; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; }
  h1 { font-size: 20px; text-align: center; margin: 12px 0 16px; letter-spacing: 1px; color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  label { font-size: 14px; color: var(--muted); font-weight: 600; }
  input[type="number"] {
    width: 115px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: #0f131a; color: #fff; font-size: 17px; text-align: right; font-weight: bold;
  }
  input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .toggle-group { display: flex; gap: 8px; }
  .toggle-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: #0f131a; color: var(--muted); font-weight: bold; cursor: pointer; font-size: 14px;
  }
  .toggle-btn.active-port { background: var(--port); color: #fff; border-color: var(--port); }
  .toggle-btn.active-stbd { background: var(--stbd); color: #fff; border-color: var(--stbd); }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
  .box { background: #0f131a; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--border); }
  .box-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .box-val { font-size: 16px; font-weight: bold; }
  .port-badge { color: var(--port); }
  .stbd-badge { color: var(--stbd); }
  .target-box { background: rgba(234, 179, 8, 0.15); border-color: var(--accent); }
  .target-box .box-val { color: var(--accent); font-size: 18px; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 15px; }
  th { color: var(--muted); font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 4px; text-align: center; border-bottom: 1px solid #232a3b; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>
<div class="app">
  <h1>⚓️ LEVEL HOSE</h1>

  <div class="card">
    <div class="row">
      <label>SIDE ALONGSIDE</label>
      <div class="toggle-group">
        <button id="btnPort" class="toggle-btn active-port" onclick="setSide('PORT')">PORT</button>
        <button id="btnStbd" class="toggle-btn" onclick="setSide('STBD')">STBD</button>
      </div>
    </div>
    <div class="row">
      <label>VSL BREADTH (m)</label>
      <input type="number" id="breadth" value="32.26" step="0.01" oninput="calc()">
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label class="port-badge">LEVEL PORT (cm)</label>
      <input type="number" id="lvlPort" value="93.0" step="0.1" oninput="calc()">
    </div>
    <div class="row">
      <label class="stbd-badge">LEVEL STBD (cm)</label>
      <input type="number" id="lvlStbd" value="88.0" step="0.1" oninput="calc()">
    </div>
    <div class="grid-3" style="margin-top: 12px;">
      <div class="box">
        <div class="box-title">DIFF (cm)</div>
        <div class="box-val" id="resDiff">-5.0</div>
      </div>
      <div class="box target-box" style="grid-column: span 2;">
        <div class="box-title">TARGET LEVEL (UPRIGHT)</div>
        <div class="box-val" id="resTarget">90.5 cm</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 12px; color: var(--accent); margin-bottom: 10px; font-weight: bold;">
      OBSERVED DRAFTS (<span id="sideLabel">PORT</span> SIDE)
    </div>
    <div class="row">
      <label>FWD (m)</label>
      <input type="number" id="obsFwd" value="8.00" step="0.01" oninput="calc()">
    </div>
    <div class="row">
      <label>MID (m)</label>
      <input type="number" id="obsMid" value="9.00" step="0.01" oninput="calc()">
    </div>
    <div class="row">
      <label>AFT (m)</label>
      <input type="number" id="obsAft" value="10.00" step="0.01" oninput="calc()">
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>MARK</th><th class="port-badge">PORT</th><th class="stbd-badge">STBD</th><th>MEAN</th></tr>
      </thead>
      <tbody>
        <tr><td>FWD</td><td id="tFwdPort">8.000</td><td id="tFwdStbd">7.995</td><td id="tFwdMean">7.998</td></tr>
        <tr><td>MID</td><td id="tMidPort">9.000</td><td id="tMidStbd">8.950</td><td id="tMidMean">8.975</td></tr>
        <tr><td>AFT</td><td id="tAftPort">10.000</td><td id="tAftStbd">9.983</td><td id="tAftMean">9.992</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="summary-grid">
      <div class="box"><div class="box-title">Q'TR MEAN</div><div class="box-val" id="resQtr">8.980 m</div></div>
      <div class="box"><div class="box-title">TRIM</div><div class="box-val" id="resTrim">1.994 m</div></div>
      <div class="box"><div class="box-title">DEFLECTION</div><div class="box-val" id="resDefl">0.020 m (HOG)</div></div>
      <div class="box"><div class="box-title">LIST</div><div class="box-val" id="resList">0.09° PORT</div></div>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(caches.open('lh-v1').then(c => c.addAll(['./']))));
      self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  let side = 'PORT';
  function setSide(s) {
    side = s;
    document.getElementById('btnPort').className = 'toggle-btn' + (s === 'PORT' ? ' active-port' : '');
    document.getElementById('btnStbd').className = 'toggle-btn' + (s === 'STBD' ? ' active-stbd' : '');
    document.getElementById('sideLabel').innerText = s;
    calc();
  }

  function calc() {
    const B = parseFloat(document.getElementById('breadth').value) || 32.26;
    const lvlP = parseFloat(document.getElementById('lvlPort').value) || 0;
    const lvlS = parseFloat(document.getElementById('lvlStbd').value) || 0;
    const obsFwd = parseFloat(document.getElementById('obsFwd').value) || 0;
    const obsMid = parseFloat(document.getElementById('obsMid').value) || 0;
    const obsAft = parseFloat(document.getElementById('obsAft').value) || 0;

    const diff = lvlS - lvlP;
    const target = (lvlP + lvlS) / 2;
    const diffM = diff / 100.0;

    const listDeg = Math.atan(diffM / B) * (180 / Math.PI);
    const listAbs = Math.abs(listDeg).toFixed(2);
    const listDir = Math.abs(listDeg) < 0.005 ? 'UPRIGHT' : (listDeg < 0 ? 'PORT' : 'STBD');

    const deltaFwd = -0.1 * diffM;
    const deltaMid = -1.0 * diffM;
    const deltaAft = -(1 / 3) * diffM;

    let fwdP, fwdS, midP, midS, aftP, aftS;
    if (side === 'PORT') {
      fwdP = obsFwd; fwdS = obsFwd - deltaFwd;
      midP = obsMid; midS = obsMid - deltaMid;
      aftP = obsAft; aftS = obsAft - deltaAft;
    } else {
      fwdS = obsFwd; fwdP = obsFwd + deltaFwd;
      midS = obsMid; midP = obsMid + deltaMid;
      aftS = obsAft; aftP = obsAft + deltaAft;
    }

    const fwdMid = (fwdP + fwdS) / 2;
    const midMid = (midP + midS) / 2;
    const aftMid = (aftP + aftS) / 2;
    const faMean = (fwdMid + aftMid) / 2;
    const qtrMean = (faMean + midMid) / 2;
    const trim = aftMid - fwdMid;
    const hogSag = faMean - midMid;

    document.getElementById('resDiff').innerText = diff.toFixed(1);
    document.getElementById('resTarget').innerText = target.toFixed(1) + ' cm';
    document.getElementById('tFwdPort').innerText = fwdP.toFixed(3);
    document.getElementById('tFwdStbd').innerText = fwdS.toFixed(3);
    document.getElementById('tFwdMean').innerText = fwdMid.toFixed(3);
    document.getElementById('tMidPort').innerText = midP.toFixed(3);
    document.getElementById('tMidStbd').innerText = midS.toFixed(3);
    document.getElementById('tMidMean').innerText = midMid.toFixed(3);
    document.getElementById('tAftPort').innerText = aftP.toFixed(3);
    document.getElementById('tAftStbd').innerText = aftS.toFixed(3);
    document.getElementById('tAftMean').innerText = aftMid.toFixed(3);

    document.getElementById('resQtr').innerText = qtrMean.toFixed(3) + ' m';
    document.getElementById('resTrim').innerText = trim.toFixed(3) + ' m';
    const deflType = Math.abs(hogSag) < 0.001 ? '' : (hogSag > 0 ? ' (HOG)' : ' (SAG)');
